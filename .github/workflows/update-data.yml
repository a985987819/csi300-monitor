name: 更新基金数据
on:
  schedule:
    - cron: "0 3 1 * *"   # 每月 1 日 03:00 UTC 自动更新
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 采集全部页签数据
        run: python tools/fetch_data.py --all --workers 8

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/all.json
          git diff --cached --quiet || git commit -m "数据月度更新 $(date +%F)"
          git push
