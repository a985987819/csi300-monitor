<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流通基金概览 · 宽基 - 沪深300指数基金</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2322cc88'/%3E%3C/svg%3E">
<script>
/* 防闪烁：在样式渲染前应用已保存的主题（默认浅色） */
try {
  var _st = JSON.parse(localStorage.getItem("hs300.settings.v1") || "{}");
  if (_st.theme === "dark") document.documentElement.classList.add("dark");
} catch (e) {}
</script>
<script>
/* 样式表会话级缓存穿透：每次整页加载用新查询串，确保部署后立即生效
   （GitHub Pages max-age=600 内浏览器会回放旧 CSS；document.write 保持渲染阻塞顺序） */
document.write('<link rel="stylesheet" href="assets/style.css?s=' + Date.now().toString(36) + '">');
</script>
</head>
<body>

<!-- ═══════════ 应用壳：顶部导航（毛玻璃）+ 页面挂载点；各页面组件按路由懒加载 ═══════════
     路由：#/broad 宽基 · #/bond 债基 · #/fav 我的自选 · #/market 市场 · #/learn 学习 · #/settings 设置 -->
<header class="topbar">
  <div class="topbar-left">
    <h1 class="brand">流通基金概览</h1>
    <span class="dot" id="marketDot"></span>
    <span class="market-info"><b id="marketStatus">休市</b> · 服务器时间 <span id="serverTime">--</span></span>
  </div>
  <nav class="topnav" id="topnav">
    <button class="nav-pill active" data-tab="broad">宽基</button>
    <button class="nav-pill" data-tab="bond">债基</button>
    <button class="nav-pill" data-tab="market">市场</button>
    <button class="nav-pill" data-tab="learn">学习</button>
    <button class="nav-pill" data-tab="company">深挖公司</button>
    <button class="nav-pill" data-tab="fav">我的自选 <span class="badge" id="favBadge">0</span></button>
    <button class="nav-pill" data-tab="settings">设置</button>
  </nav>
  <button class="theme-btn" id="btnTheme" title="切换浅色 / 深色主题">🌙</button>
</header>

<!-- 页面组件挂载点：路由按需注入 <main class="page"> 并切换 .active -->
<main id="app" class="app-mount"></main>

<!-- ═══════════ 壳级全局浮层（各页面组件共享） ═══════════ -->

<!-- 表头筛选弹窗 -->
<div class="filter-pop" id="filterPop" hidden>
  <div class="fp-head"><b id="fpTitle">筛选</b><span class="fp-close" id="fpClose">×</span></div>
  <div class="fp-quick" id="fpQuick">
    <button type="button" data-q="top10">前 10 项</button>
    <button type="button" data-q="above">高于平均</button>
    <button type="button" data-q="below">低于平均</button>
  </div>
  <div class="fp-stats" id="fpStats"></div>
  <div class="fp-range" id="fpRange">
    <label class="fp-op" id="fpMinOp">≥</label><input type="text" id="fpMin" step="any" inputmode="decimal">
    <label class="fp-op" id="fpMaxOp">≤</label><input type="text" id="fpMax" step="any" inputmode="decimal">
  </div>
  <div class="fp-contains" id="fpContains">
    <label class="fp-op">包含</label><input type="text" id="fpKw" placeholder="关键字模糊匹配">
  </div>
  <div class="fp-foot">
    <button type="button" class="fp-clear" id="fpClear">清空条件</button>
    <span class="fp-hit" id="fpHit"></span>
  </div>
</div>

<!-- 表头指标说明卡 -->
<div class="stat-pop" id="statPop" hidden></div>

<!-- 对比工具条（选中基金后浮现） -->
<div class="cmp-bar" id="cmpBar" hidden>
  <span class="cmp-bar-text">对比 <b id="cmpCount">0</b>/4</span>
  <span class="cmp-names" id="cmpNames"></span>
  <button type="button" class="btn btn-green" id="cmpGo">开始对比</button>
  <button type="button" class="btn btn-ghost" id="cmpClear">清空</button>
</div>

<!-- 基金对比弹窗 -->
<div class="chart-veil" id="cmpVeil" hidden>
  <div class="chart-modal" id="cmpModal">
    <div class="cm-head"><b>基金对比</b><span class="cm-sub" id="cmpSub"></span><span class="cm-close" id="cmpClose">×</span></div>
    <div class="cmp-table-wrap" id="cmpTable"></div>
    <div class="cm-range" id="cmpRange">
      <button type="button" data-days="365" class="on">近1年</button>
      <button type="button" data-days="1095">近3年</button>
      <button type="button" data-days="0">成立以来</button>
    </div>
    <div class="cm-svg" id="cmpSvg"></div>
    <div class="cm-note">曲线颜色与表头色点对应；虚线为沪深300基准（当前页签有基准行时显示）。</div>
  </div>
</div>

<!-- 业绩走势对比图 -->
<div class="chart-veil" id="chartVeil" hidden>
  <div class="chart-modal" id="chartModal">
    <div class="cm-head">
      <b id="cmTitle">业绩走势对比</b>
      <span class="cm-sub" id="cmSub"></span>
      <span class="cm-close" id="cmClose">×</span>
    </div>
    <div class="cm-stats" id="cmStats"></div>
    <div class="cm-range" id="cmRange">
      <button type="button" data-days="365" class="on">近1年</button>
      <button type="button" data-days="1095">近3年</button>
      <button type="button" data-days="0">成立以来</button>
    </div>
    <div class="cm-svg" id="cmSvg"></div>
    <div class="cm-note">复权净值归一化为区间累计收益 %；虚线为对应基准指数（债基页签无基准对照）。</div>
  </div>
</div>

<!-- 加载遮罩 -->
<div class="load-overlay" id="loadOverlay" hidden>
  <div class="load-card">
    <div class="load-title"><span class="dot"></span> 实时数据加载中</div>
    <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
    <div class="load-stage" id="loadStage">正在准备…</div>
    <div class="load-actions">
      <button class="btn btn-ghost" id="loadSkip">先用离线数据查看</button>
    </div>
  </div>
</div>

<!-- 壳层服务（共享工具/主题/时钟/自选角标） + 路由；各页面组件由路由按需懒加载（会话级防缓存）：
     page-fundtable.js+app.js（宽基/债基/自选）· page-market.js · learn-data.js+page-learn.js · page-settings.js
     注意：以下 ?v= 版本号在壳层脚本（data.js/util.js/shell.js/router.js）内容变更时需手动递增 -->
<script src="data/data.js?v=20261122b"></script>
<script src="assets/core/util.js?v=20261122b"></script>
<script src="assets/core/shell.js?v=20261122b"></script>
<script src="assets/router.js?v=20261122b"></script>
</body>
</html>
